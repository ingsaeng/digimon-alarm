name: megabox-alarm

# 저장 경로: .github/workflows/megabox.yml

on:
  schedule:
    - cron: "3-58/5 * * * *"   # 5분마다. 혼잡한 정각을 피해 오프셋 적용
  workflow_dispatch:         # 수동 실행 버튼
    inputs:
      mode:
        description: "실행 모드"
        required: false
        default: "watch"
        type: choice
        options: [watch, probe, test]

# concurrency 미설정. 실행이 겹쳐도 취소되지 않고 모두 진행되도록 의도
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: 이전 상태 복원
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: megabox-state-
          restore-keys: megabox-state-

      - name: 네트워크 진단
        continue-on-error: true
        run: |
          echo "--- DNS 조회 ---"
          getent ahosts www.megabox.co.kr || echo "DNS 실패"
          echo "--- IPv4 강제 접속 ---"
          curl -4 -sS -o /dev/null --max-time 20 \
            -w "HTTP %{http_code} / %{time_total}s / IP %{remote_ip}\n" \
            https://www.megabox.co.kr/ || echo "IPv4 curl 실패"
          echo "--- 기본(IPv6 우선) 접속 ---"
          curl -sS -o /dev/null --max-time 20 \
            -w "HTTP %{http_code} / %{time_total}s / IP %{remote_ip}\n" \
            https://www.megabox.co.kr/ || echo "기본 curl 실패"

      - name: 좌석 확인
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MODE: ${{ inputs.mode || 'watch' }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: node check.js

      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: megabox-state-${{ github.run_id }}-${{ github.run_attempt }}
